controllers:
  resource: ../src/Controller/
  type: annotation

kernel:
  resource: ../src/Kernel.php
  type: annotation

app_login:
    path: /login
    controller: App\Controller\SecurityController::login

default_redirect:
  path: /
  controller: App\Controller\SecurityController::login
  defaults:
    route: app_login



app_chatbot:
  path: /chatbot
  controller: App\Controller\ChatbotController::index

chatbot_response:
  path: /chatbot/response
  controller: App\Controller\ChatbotController::getResponse
  methods: POST

chatbot_history:
  path: /chatbot/history
  controller: App\Controller\ChatbotController::getChatHistory




predict_university_transition:
  path: /predict/university-transition
  controller: App\Controller\PredictionUniversityController::predict
  methods: [POST, GET]